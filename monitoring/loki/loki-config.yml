auth_enabled: false


server:
  http_listen_port: 3100
  grpc_listen_port: 9096


common:
  path_prefix: /loki

  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

  replication_factor: 1

  ring:
    kvstore:
      store: inmemory


schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13

      index:
        prefix: index_
        period: 24h


storage_config:
  filesystem:
    directory: /loki/chunks


compactor:
  working_directory: /loki/compactor

  # Enable automatic log deletion according to retention_period.
  retention_enabled: true

  # Required when retention/delete requests are enabled.
  delete_request_store: filesystem


limits_config:
  # Keep logs for 30 days.
  retention_period: 720h

  # Reject logs that are extremely old.
  reject_old_samples: true
  reject_old_samples_max_age: 168h

  # Allow structured metadata from Alloy / OpenTelemetry.
  allow_structured_metadata: true


analytics:
  reporting_enabled: false
